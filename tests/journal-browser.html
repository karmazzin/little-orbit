<!doctype html><html lang="ru"><meta charset="utf-8"><title>Journal test fixture</title><h1>Проверка журнала · тестовые сохранения</h1><p>Использовать только на отдельном тестовом origin.</p><button id="seed">Создать тестовое прохождение</button><a href="../index.html">Открыть игру</a><button id="verify">Проверить сброс после перезагрузки</button><pre id="result"></pre><script type="module">
import {PROGRESS_KEYS} from '../src/progress-reset.ts';
const fixtures={story:{phase:'active',letters:['bridge']},content:{version:1,postcards:'active',cards:['arch'],iris:'searching',clues:['camp','arch']},adventures:{version:1,meteor:'complete',bell:'new',tracks:0,runes:0,cave:false,bottles:['bottle-1'],tales:['amber'],festival:false},exploration:{version:1,places:['arch'],nightMeeting:true},'azure-story':{version:1,map:true,marks:[],bottle:false,entry:null,complete:false},frontier:{version:1,wind:'accepted',diary:'searching',pages:['old-station']},'known-journeys':['tales'],'tracked-journey':'letters'};
document.getElementById('seed').onclick=()=>{for(const [id,value] of Object.entries(fixtures))localStorage.setItem(`little-orbit-${id}-v1`,JSON.stringify(value));localStorage.setItem('little-orbit-camp-v1','found');localStorage.setItem('little-orbit-azure-beacon-v1','on');localStorage.setItem('journal-test-preferences',localStorage.getItem('little-orbit-music-v1')??'');document.getElementById('result').textContent='Тестовый прогресс создан';};
document.getElementById('verify').onclick=()=>{const remaining=PROGRESS_KEYS.filter(k=>!k.includes('-world-')&&!k.includes('-residents-')&&localStorage.getItem(k)!==null);document.getElementById('result').textContent=remaining.length?'FAIL: '+remaining.join(', '):'PASS: все истории и находки удалены после перезагрузки';};
</script></html>
